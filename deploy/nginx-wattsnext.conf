# nginx site for WattsNext (server: energy-game.enzo.kit.edu).
# Reference copy of /etc/nginx/sites-available/wattsnext on the server.
#
# The `# managed by Certbot` lines were generated by `certbot --nginx` (TLS setup,
# see DEPLOYMENT.md). When editing the live file on the server, never overwrite
# those lines wholesale — certbot rewrites them on certificate renewal.
#
# The X-Forwarded-* headers below are essential: TLS terminates at nginx, so
# without them the backend would think it speaks http and reject the https
# Origin as cross-origin (403 "Invalid CORS request"). They pair with
# `server.forward-headers-strategy: framework` in application.yml.

server {
    server_name energy-game.enzo.kit.edu;

    root /var/www/wattsnext;
    index index.html;

    # React SPA: fall back to index.html for unknown paths
    location / {
        try_files $uri /index.html;
    }

    # Forward the REST API to the backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Forward the WebSocket (STOMP) to the backend
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/energy-game.enzo.kit.edu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/energy-game.enzo.kit.edu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = energy-game.enzo.kit.edu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name energy-game.enzo.kit.edu;
    return 404; # managed by Certbot


}
